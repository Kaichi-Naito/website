<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="keywords" content="ギター, 作曲, 内藤海地, Kaichi, Kaichi Naito, PHALUX, Windows95">
    <meta name="description" content="Kaichi（内藤海地）へのコンタクトページ。ご依頼やお問い合わせはこちらから。">  
    <meta property="og:title" content="Contact - Kaichi Guitar Music">
    <meta property="og:description" content="Kaichi（内藤海地）へのコンタクトページ。ご依頼やお問い合わせはこちらから。">
    <meta property="og:image" content="https://kaichi-naito.github.io/website/images/card-image.jpg">
    <meta property="og:url" content="https://kaichi-naito.github.io/website/Contact.html">
    <link rel="canonical" href="https://kaichi-naito.github.io/website/Contact.html">
    <meta property="og:type" content="website">
    <meta http-equiv="Cache-Control" content="max-age=31536000">
    <title>Contact - Kaichi Guitar Music</title>
    <link rel="icon" href="images/card-image.jpg" type="image/jpg">
        <link rel="stylesheet" href="css/common-ui.css">
    <style>
/* --- Contact page --- */
        .calc-display {
            background-color: #ffffff;
            border: 2px inset #ffffff;
            padding: 5px 10px;
            text-align: right;
            font-size: 24px;
            margin-bottom: 10px;
            height: 35px;
            box-shadow: inset 2px 2px 0px #808080;
        }

        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
        }

        .win95-calc-btn {
            background-color: #c0c0c0;
            border: 2px solid;
            border-color: #ffffff #808080 #808080 #ffffff;
            padding: 6px 0;
            font-family: 'PixelMplus', sans-serif;
            cursor: pointer;
            text-align: center;
            font-size: 16px;
            color: black;
            user-select: none;
        }

        .win95-calc-btn:active {
            border-color: #808080 #ffffff #ffffff #808080;
            padding: 7px 0 5px 0;
        }

        #win-message {
            width: 320px;
        }

        #win-calculator {
            width: 280px;
        }

        #win-mail {
            width: 300px;
        }

        #win-warning {
            width: 260px;
            animation: none;
        }

        #win-social-dm {
            width: 280px;
        }

        @media (max-width: 800px) {
            #win-message {
                width: 82vw !important;
                max-width: 320px !important;
            }

            #win-calculator {
                width: 200px !important;
            }

            #win-calculator .win95-calc-btn {
                font-size: 14px;
                padding: 4px 0;
            }

            #win-calculator .calc-display {
                font-size: 18px;
                height: 28px;
            }

            #win-mail {
                width: 82vw !important;
                max-width: 300px !important;
            }

            #win-warning {
                width: 78vw !important;
                max-width: 260px !important;
            }

            #win-social-dm {
                width: 82vw !important;
                max-width: 280px !important;
            }
        }
    </style>
</head>
<body id="win95-desktop">
    <h1 class="header-title">Kaichi Guitar Music</h1>

    <div id="common-nav"></div>

    <div class="window" id="win-message" style="z-index: 103;">
        <div class="title-bar draggable-cursor" id="handle-message">
            <span>Message</span>
            <div class="title-bar-controls">
                <button type="button" class="window-control-button minimize-button" aria-label="Minimize">_</button>
                <button type="button" class="window-control-button maximize-button" aria-label="Maximize">□</button>
                <button type="button" class="close-button" aria-label="Close">×</button>
            </div>
        </div>
        <div class="window-contents" style="font-size: 13px;">
            以下のテストに答えるとメールアドレスが表示されます。<br>
            <small>Answer the Test below to display the email address.</small>
        </div>
    </div>

    <div class="window" id="win-calculator" style="z-index: 102;">
        <div class="title-bar draggable-cursor" id="handle-calculator">
            <span>Calculator.exe</span>
            <div class="title-bar-controls">
                <button type="button" class="window-control-button minimize-button" aria-label="Minimize">_</button>
                <button type="button" class="window-control-button maximize-button" aria-label="Maximize">□</button>
                <button type="button" class="close-button" aria-label="Close">×</button>
            </div>
        </div>
        <div class="window-contents">
            <div id="question" style="text-align:center; margin-bottom:10px; font-size:16px; background:#eee; padding:5px; border:1px inset #fff;">読み込み中…</div>
            <div class="calc-display" id="display">0</div>
            <div class="keypad">
                <button type="button" class="win95-calc-btn click-target" onclick="inputNum(7)">7</button>
                <button type="button" class="win95-calc-btn click-target" onclick="inputNum(8)">8</button>
                <button type="button" class="win95-calc-btn click-target" onclick="inputNum(9)">9</button>
                <button type="button" class="win95-calc-btn click-target" onclick="inputNum(4)">4</button>
                <button type="button" class="win95-calc-btn click-target" onclick="inputNum(5)">5</button>
                <button type="button" class="win95-calc-btn click-target" onclick="inputNum(6)">6</button>
                <button type="button" class="win95-calc-btn click-target" onclick="inputNum(1)">1</button>
                <button type="button" class="win95-calc-btn click-target" onclick="inputNum(2)">2</button>
                <button type="button" class="win95-calc-btn click-target" onclick="inputNum(3)">3</button>
                <button type="button" class="win95-calc-btn click-target" onclick="inputNum(0)">0</button>
                <button type="button" class="win95-calc-btn click-target" onclick="clearDisplay()">C</button>
                <button type="button" class="win95-calc-btn click-target" style="color:red; font-weight:bold;" onclick="checkAnswer()">OK</button>
            </div>
        </div>
    </div>

    <div class="window" id="win-mail" style="z-index: 150; display: none;">
        <div class="title-bar draggable-cursor" id="handle-mail">
            <span>Mail.exe</span>
            <div class="title-bar-controls">
                <button type="button" class="window-control-button minimize-button" aria-label="Minimize">_</button>
                <button type="button" class="window-control-button maximize-button" aria-label="Maximize">□</button>
                <button type="button" class="close-button" aria-label="Close">×</button>
            </div>
        </div>
        <div class="window-contents" style="text-align: center;">
            <p style="margin: 0 0 10px 0; font-size: 14px;">Contact Email:</p>
            <div style="background: #fff; border: 2px inset #fff; padding: 10px; font-size: 16px; box-shadow: inset 2px 2px 0px #808080; user-select: all;">
                kaichi.naito@gmail.com
            </div>
        </div>
    </div>

    <div class="window" id="win-warning" style="z-index: 160; display: none;">
        <div class="title-bar draggable-cursor" id="handle-warning">
            <span>Error.exe</span>
            <div class="title-bar-controls">
                <button type="button" class="window-control-button minimize-button" aria-label="Minimize">_</button>
                <button type="button" class="window-control-button maximize-button" aria-label="Maximize">□</button>
                <button type="button" class="close-button" aria-label="Close">×</button>
            </div>
        </div>
        <div class="window-contents" style="text-align: center;">
            <img src="https://kaichi-naito.github.io/website/images/mark_attention.png" alt="Warning" style="width: 38px; height: 38px; margin-bottom: 10px; image-rendering: pixelated;">
            <p style="margin: 0 0 5px 0; font-size: 14px; font-weight: bold;">答えが間違っています。</p>
            <p style="margin: 0 0 15px 0; font-size: 12px;">Incorrect answer.</p>
            <button type="button" class="win95-btn click-target" onclick="retryCalc()" style="width: 100px; margin: 0 auto; display: block;">Retry</button>
        </div>
    </div>

    <div class="window" id="win-social-dm" style="z-index: 101;">
        <div class="title-bar draggable-cursor" id="handle-social-dm">
            <span>Social</span>
            <div class="title-bar-controls">
                <button type="button" class="window-control-button minimize-button" aria-label="Minimize">_</button>
                <button type="button" class="window-control-button maximize-button" aria-label="Maximize">□</button>
                <button type="button" class="close-button" aria-label="Close">×</button>
            </div>
        </div>
        <div class="window-contents" style="text-align: center;">
            <a href="https://twitter.com/messages/compose?recipient_id=261132037"
               target="_blank" rel="noopener noreferrer"
               class="win95-btn click-target"
               style="font-size: 14px; width: 85%; color: blue !important; margin: 0 auto;">
                X(Twitter)のDMはこちら
            </a>
        </div>
    </div>

    

    <script>
        function setInitialPositions() {
            var isMobile = window.matchMedia("(max-width: 800px)").matches;
            var msg = document.getElementById('win-message');
            var calc = document.getElementById('win-calculator');
            var dm = document.getElementById('win-social-dm');
            var mail = document.getElementById('win-mail');
            var warning = document.getElementById('win-warning');
            var maxBottom = 0;

            if (isMobile) {
                if (msg && msg.style.display !== 'none') { msg.style.left = '5%'; msg.style.top = '165px'; }
                if (calc && calc.style.display !== 'none') { calc.style.left = '10%'; calc.style.top = '285px'; }
                if (dm && dm.style.display !== 'none') {
                    dm.style.left = '14%';
                    dm.style.top = '585px';
                    maxBottom = 585 + (dm.offsetHeight || 100) + 110;
                } else {
                    maxBottom = 820;
                }
                if (mail) { mail.style.left = '10%'; mail.style.top = '350px'; }
                if (warning) { warning.style.left = '10%'; warning.style.top = '330px'; }
            } else {
                if (msg && msg.style.display !== 'none') { msg.style.left = '29%'; msg.style.top = '205px'; }
                if (calc && calc.style.display !== 'none') { calc.style.left = '43%'; calc.style.top = '335px'; }
                if (dm && dm.style.display !== 'none') {
                    dm.style.left = '56%';
                    dm.style.top = '595px';
                    maxBottom = 595 + (dm.offsetHeight || 150) + 220;
                } else {
                    maxBottom = 900;
                }
                if (mail) { mail.style.left = '40%'; mail.style.top = '390px'; }
                if (warning) { warning.style.left = '45%'; warning.style.top = '385px'; }
            }

            if (maxBottom > 0) document.body.style.minHeight = maxBottom + 'px';
        }

        var currentInput = '';
        var calcA = Math.floor(Math.random() * 20) + 1;
        var calcB = Math.floor(Math.random() * 20) + 1;
        var correctAnswer = calcA + calcB;

        function initContactCalculator() {
            var questionBox = document.getElementById('question');
            if (questionBox) questionBox.textContent = calcA + ' ＋ ' + calcB + ' ＝ ？';
        }

        function inputNum(num) {
            currentInput += String(num);
            var display = document.getElementById('display');
            if (display) display.textContent = currentInput;
        }

        function clearDisplay() {
            currentInput = '';
            var display = document.getElementById('display');
            if (display) display.textContent = '0';
        }

        function retryCalc() {
            var warningWin = document.getElementById('win-warning');
            if (warningWin && window.KaichiUI) window.KaichiUI.closeWindow(warningWin);

            var questionBox = document.getElementById('question');
            if (questionBox) questionBox.textContent = calcA + ' ＋ ' + calcB + ' ＝ ？';
            clearDisplay();
        }

        function checkAnswer() {
            var questionBox = document.getElementById('question');
            var display = document.getElementById('display');

            if (parseInt(currentInput, 10) === correctAnswer) {
                if (questionBox) questionBox.textContent = 'SUCCESS';
                if (display) display.textContent = 'OK!';

                var mailWin = document.getElementById('win-mail');
                if (mailWin && window.KaichiUI) {
                    window.KaichiUI.showWindow(mailWin);
                    window.KaichiUI.centerWindow(mailWin);
                }
            } else {
                var warningWin = document.getElementById('win-warning');
                if (warningWin && window.KaichiUI) {
                    window.KaichiUI.showWindow(warningWin);
                    window.KaichiUI.centerWindow(warningWin);
                }

                if (window.KaichiUI && window.KaichiUI.errorSound) {
                    try {
                        window.KaichiUI.errorSound.currentTime = 0;
                        window.KaichiUI.errorSound.play().catch(function(){});
                    } catch (e) {}
                }
            }
        }

        document.addEventListener('kaichi-ui-ready', initContactCalculator);
    </script>
    <script src="js/common-ui.js"></script>
</body>
</html>
