<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="keywords" content="ギター, 作曲, 内藤海地, Kaichi, Kaichi Naito, PHALUX, Windows95">
    <meta name="description" content="PHALUXのKaichiの各SNSやプロフィールまとめ。ギター演奏・オリジナル楽曲を紹介する。最新楽曲の視聴も可能です。">  
    <meta property="og:title" content="Kaichi Guitar Music">
    <meta property="og:description" content="Kaichiのオリジナル楽曲・ギター演奏動画を公開中。">
    <meta property="og:image" content="https://kaichi-naito.github.io/website/images/card-image.jpg">
    <meta property="og:url" content="https://kaichi-naito.github.io/website/">
    <link rel="canonical" href="https://kaichi-naito.github.io/website/">
    <meta property="og:type" content="website">
    <meta http-equiv="Cache-Control" content="max-age=31536000">
    <title>Kaichi Guitar Music</title>
    <link rel="icon" href="images/card-image.jpg" type="image/jpg">
        <link rel="stylesheet" href="css/common-ui.css">
    <link rel="stylesheet" href="css/room-view.css?v=20260906-0803" id="room-view-styles">
</head>
<body id="win95-desktop">
    <div id="desktop-surface">
    <h1 class="header-title">Kaichi Guitar Music</h1>

    <div id="common-nav"></div>

    <div class="window" id="win-profile" style="width: 380px; z-index: 104;">
        <div class="title-bar draggable-cursor" id="handle-profile">
            <span>Profile.exe</span><div class="title-bar-controls"><button type="button" class="window-control-button minimize-button" aria-label="Minimize">_</button><button type="button" class="window-control-button maximize-button" aria-label="Maximize">□</button><button type="button" class="close-button" aria-label="Close">×</button></div>
        </div>
        <div class="window-contents profile-section">
            <img src="https://kaichi-naito.github.io/website/images/DotGuitar.png" alt="Kaichi" class="profile-img">
            <div class="profile-text">
                <h2 style="margin:0 0 10px 0;">Kaichi</h2>
                <p style="margin:0 0 15px 0;">Guitar, write music.</p>
                <a href="https://www.hotoneaudio.com/artists/Kaichi%20Naito" target="_blank" rel="noopener noreferrer" style="font-size: 14px; color: blue;">Hotone Official Artist</a>
            </div>
        </div>
    </div>


    <div class="window" id="win-counter" style="z-index: 106;">
        <div class="title-bar draggable-cursor" id="handle-counter">
            <span>Visitor_Counter.exe</span><div class="title-bar-controls"><button type="button" class="window-control-button minimize-button" aria-label="Minimize">_</button><button type="button" class="window-control-button maximize-button" aria-label="Maximize">□</button><button type="button" class="close-button" aria-label="Close">×</button></div>
        </div>
        <div class="window-contents">
            <p class="visitor-counter-line">You are the</p>
            <div id="visitor-counter-number" class="visitor-counter-display" aria-live="polite">------</div>
            <p id="visitor-counter-suffix" class="visitor-counter-suffix">visitor!</p>
        </div>
    </div>

    <div class="window" id="win-phalux" style="width: 175px; z-index: 105;"> 
        <div class="title-bar draggable-cursor" id="handle-phalux">
            <span>PHALUX.band</span><div class="title-bar-controls"><button type="button" class="window-control-button minimize-button" aria-label="Minimize">_</button><button type="button" class="window-control-button maximize-button" aria-label="Maximize">□</button><button type="button" class="close-button" aria-label="Close">×</button></div>
        </div>
        <div class="window-contents" style="text-align: center; padding: 10px;"> 
            <a href="https://phalux.bitfan.id/" target="_blank" rel="noopener noreferrer" class="phalux-link"> 
                <img src="https://kaichi-naito.github.io/website/images/PHALUX_logo.png" alt="PHALUX" style="width: 100%; max-width: 150px; height: auto; border: 2px solid #808080; display: block; margin: 0 auto;"> 
            </a>
        </div>
    </div>

    <div class="window" id="win-social" style="width: 450px; z-index: 103;">
        <div class="title-bar draggable-cursor" id="handle-social">
            <span>Social_Media.lnk</span><div class="title-bar-controls"><button type="button" class="window-control-button minimize-button" aria-label="Minimize">_</button><button type="button" class="window-control-button maximize-button" aria-label="Maximize">□</button><button type="button" class="close-button" aria-label="Close">×</button></div>
        </div>
        <div class="window-contents">
            <div class="social-icons-grid">
                <a href="https://x.com/Kaichi_zZ" target="_blank" rel="noopener noreferrer" class="win95-btn social-item"><img src="https://kaichi-naito.github.io/website/images/X_dot_logo.png" alt="">X</a>
                <a href="https://www.instagram.com/kaichi_zz/" target="_blank" rel="noopener noreferrer" class="win95-btn social-item"><img src="https://kaichi-naito.github.io/website/images/instagram_dot_logo.png" alt="">Insta</a>
                <a href="https://www.youtube.com/KaichizZ" target="_blank" rel="noopener noreferrer" class="win95-btn social-item"><img src="https://kaichi-naito.github.io/website/images/Youtube_dot_logo.png" alt="">YouTube</a>
                <a href="https://www.tiktok.com/@kaichi_zz" target="_blank" rel="noopener noreferrer" class="win95-btn social-item"><img src="https://kaichi-naito.github.io/website/images/Tiktok_icon.png" alt="">TikTok</a>
                <a href="https://open.spotify.com/artist/0zok75wIWAb9qQ0hofCT1h?si=QrD4CGKXSyGttC7-3nM-XA" target="_blank" rel="noopener noreferrer" class="win95-btn social-item"><img src="https://kaichi-naito.github.io/website/images/spotify-icon.png" alt="">Spotify</a>
                <a href="https://music.apple.com/jp/artist/kaichi-naito/1542151566" target="_blank" rel="noopener noreferrer" class="win95-btn social-item"><img src="https://kaichi-naito.github.io/website/images/applemusic_dot_logo.png" alt="">Music</a>
            </div>
        </div>
    </div>

    <div class="window" id="win-spotify" style="width: 600px; z-index: 102;">
        <div class="title-bar draggable-cursor" id="handle-spotify">
            <span>CD_Player.exe</span><div class="title-bar-controls"><button type="button" class="window-control-button minimize-button" aria-label="Minimize">_</button><button type="button" class="window-control-button maximize-button" aria-label="Maximize">□</button><button type="button" class="close-button" aria-label="Close">×</button></div>
        </div>
        <div class="window-contents">
            <iframe title="Kaichi Spotify album player" src="https://open.spotify.com/embed/album/414HJT5311vIKZHsxh56S2?utm_source=generator" width="100%" height="152" frameBorder="0" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
        </div>
    </div>

    <div class="window" id="win-youtube" style="width: 800px; z-index: 101;">
        <div class="title-bar draggable-cursor" id="handle-youtube">
            <span>Media_Player.avi</span><div class="title-bar-controls"><button type="button" class="window-control-button minimize-button" aria-label="Minimize">_</button><button type="button" class="window-control-button maximize-button" aria-label="Maximize">□</button><button type="button" class="close-button" aria-label="Close">×</button></div>
        </div>
        <div class="window-contents">
            <h3 style="margin-top:0;">Original songs🎸</h3>
            <div style="position:relative; padding-top: 56.25%;">
                <iframe title="Kaichi original songs playlist" src="https://www.youtube.com/embed/videoseries?list=PLaOBQu1YWaAJwvtVQX4xxTIkby7Bj1YF2" 
                        style="position:absolute; top:0; left:0; width:100%; height:100%;" frameborder="0" allowfullscreen loading="lazy"></iframe>
            </div>
        </div>
    </div>


    

    </div>
    <button type="button" id="room-view-toggle" class="win95-btn" aria-haspopup="dialog" aria-label="部屋を見渡す" title="部屋を見渡す">部屋を見渡す</button>
    <script>
        // Also runs after the shared UI's soft reboot, which skips external scripts.
        document.addEventListener('kaichi-ui-ready', function () {
            if (!document.getElementById('room-view-styles')) {
                var css = document.createElement('link');
                css.id = 'room-view-styles';
                css.rel = 'stylesheet';
                css.href = 'css/room-view.css?v=20260906-0803';
                document.head.appendChild(css);
            }
            if (window.KaichiRoomView) {
                window.KaichiRoomView.init();
            } else if (!document.getElementById('room-view-script')) {
                var js = document.createElement('script');
                js.id = 'room-view-script';
                js.src = 'js/room-view.js?v=20260906-0940';
                document.head.appendChild(js);
            }
        });

        function setInitialPositions() {
            var isMobile = window.matchMedia("(max-width: 800px)").matches;
            var profile = document.getElementById('win-profile');
            var counter = document.getElementById('win-counter');
            var phalux = document.getElementById('win-phalux');
            var social = document.getElementById('win-social');
            var spotify = document.getElementById('win-spotify');
            var youtube = document.getElementById('win-youtube');
            var maxBottom = 0;

            if (isMobile) {
                if (profile && profile.style.display !== 'none') { profile.style.left = '4%'; profile.style.top = '150px'; }
                if (phalux && phalux.style.display !== 'none') { phalux.style.left = '52%'; phalux.style.top = '250px'; }
                if (social && social.style.display !== 'none') { social.style.left = '15%'; social.style.top = '420px'; }
                if (spotify && spotify.style.display !== 'none') { spotify.style.left = '20%'; spotify.style.top = '620px'; }
                if (youtube && youtube.style.display !== 'none') {
                    youtube.style.left = '2%';
                    youtube.style.top = '730px';
                    maxBottom = 730 + (youtube.offsetHeight || 400) + 100;
                } else {
                    maxBottom = 900;
                }
            } else {
                if (counter && counter.style.display !== 'none') { counter.style.left = '3%'; counter.style.top = '190px'; }
                if (profile && profile.style.display !== 'none') { profile.style.left = '28%'; profile.style.top = '200px'; }
                if (phalux && phalux.style.display !== 'none') { phalux.style.left = '75%'; phalux.style.top = '170px'; }
                if (social && social.style.display !== 'none') { social.style.left = '57%'; social.style.top = '350px'; }
                if (spotify && spotify.style.display !== 'none') { spotify.style.left = '15%'; spotify.style.top = '470px'; }
                if (youtube && youtube.style.display !== 'none') {
                    youtube.style.left = '40%';
                    youtube.style.top = '700px';
                    maxBottom = 650 + (youtube.offsetHeight || 450) + 150;
                } else {
                    maxBottom = 1000;
                }
            }

            if (maxBottom > 0) document.body.style.minHeight = maxBottom + 'px';
        }

        function updateVisitorCounter() {
            var numberEl = document.getElementById('visitor-counter-number');
            var suffixEl = document.getElementById('visitor-counter-suffix');
            if (!numberEl || !suffixEl) return;

            fetch('https://kaichi.goatcounter.com/counter/%2Fwebsite.json')
                .then(function (response) {
                    if (!response.ok) throw new Error('Counter request failed: ' + response.status);
                    return response.json();
                })
                .then(function (data) {
                    var rawCount = parseInt(String(data.count).replace(/,/g, ''), 10);
                    if (!Number.isFinite(rawCount)) throw new Error('Invalid counter value');
                    numberEl.textContent = String(rawCount + 1200).padStart(6, '0');
                    suffixEl.textContent = 'visitor!';
                })
                .catch(function (error) {
                    numberEl.textContent = '------';
                    suffixEl.textContent = 'visitor!';
                    console.warn('Visitor counter could not be loaded.', error);
                });
        }

        document.addEventListener('kaichi-ui-ready', updateVisitorCounter);
    </script>
    <script src="js/common-ui.js"></script>
</body>
</html>
