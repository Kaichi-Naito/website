name: Prepare T4P Rolling replacement
on:
  push:
    branches:
      - t4p-rolling-asset
    paths:
      - .github/workflows/t4p-prepare-rolling.yml
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: t4p-rolling-asset
          fetch-depth: 1
      - name: Apply focused Rolling updates
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} occurrence(s), found {actual}: {old!r}')
              p.write_text(text.replace(old, new))

          replace('rhythm/README.md',
              '- Source: user-uploaded `rhythm/Rolling_Game.mp3`, PHALUX.',
              '- Source: user-uploaded `rhythm/Rolling_T4P.ver.mp3`, PHALUX.')
          replace('rhythm/README.md',
              '- Scope: configured in the catalog; Rolling currently uses **120 seconds**. Playback stops at the boundary even for a longer MP3.',
              '- Scope: the catalog keeps each song\'s source duration, while `catalog.mjs` currently limits gameplay to the first **30 seconds**. Playback stops at that test boundary even for a longer MP3.')
          replace('rhythm/README.md',
              '- MIDI is parsed on every page load with cache bypass. Notes after 120 seconds\n  are excluded and crossing holds are shortened.',
              '- MIDI is parsed on every page load with cache bypass. Notes after 30 seconds\n  are excluded and crossing holds are shortened.')
          replace('rhythm/README.md',
              'The public chart has one fixed location: **`rhythm/charts/Rolling_Game.mid`**.\nUpload/replace it on `main`, wait for GitHub Pages deployment, then reload the page.',
              'Rolling uses two public chart files:\n\n- NORMAL: **`rhythm/charts/Rolling_Game.mid`**\n- HARD: **`rhythm/charts/Rolling_T4P_HARD.mid`**\n\nUpload/replace the appropriate file on `main`, wait for GitHub Pages deployment, then reload the page.')
          replace('rhythm/README.md',
              '- Playback remains the first **120 seconds**. Later notes are excluded and holds',
              '- Playback currently remains the first **30 seconds**. Later notes are excluded and holds')
          replace('rhythm/README.md',
              'It lists the selected chart\'s top 20 scores.',
              'It lists the selected chart\'s top 10 scores.')
          replace('rhythm/README.md',
              'two-minute result screen, and mobile layout.',
              '30-second result screen, and mobile layout.')

          replace('rhythm/charts/README.md',
              '- ファイル名：**`Rolling_Game.mid`**（大文字・小文字もこの通り）\n- 完全なパス：**`rhythm/charts/Rolling_Game.mid`**\n\nこのフォルダーに `Rolling_Game.mid` を追加すると、ゲームが起動時に自動で読み込みます。',
              '- NORMAL：**`rhythm/charts/Rolling_Game.mid`**\n- HARD：**`rhythm/charts/Rolling_T4P_HARD.mid`**\n\nこのフォルダーに各MIDIを追加すると、公開中の譜面設定に従ってゲームが起動・選曲時に自動で読み込みます。')
          replace('rhythm/charts/README.md',
              '1. REAPERでMIDIを編集し、`Rolling_Game.mid` として書き出します。',
              '1. REAPERでMIDIを編集し、NORMALは `Rolling_Game.mid`、HARDは `Rolling_T4P_HARD.mid` として書き出します。')
          replace('rhythm/charts/README.md',
              '- プレイ時間はスプレッドシートの「譜面」タブで指定します。Rollingは現在120秒です。境界より後の音符は省略し、またぐ長押しは短縮します。',
              '- プレイ時間はスプレッドシートの「譜面」タブで指定しますが、現在のテスト版はゲーム側で冒頭30秒に制限しています。境界より後の音符は省略し、またぐ長押しは短縮します。')

          replace('rhythm/ranking/README.md',
              '| D | 音源 | rhythm/Rolling_Game.mp3 |',
              '| D | 音源 | rhythm/Rolling_T4P.ver.mp3 |')
          replace('rhythm/ranking/README.md',
              '| H | プレイ時間（秒） | 120 |',
              '| H | プレイ時間（秒） | 125.952（ゲーム側は30秒上限） |')
          replace('rhythm/ranking/README.md',
              '同じ曲の別難易度を追加する場合は、新しい行に別の譜面ID・難易度・MIDIを指定します。',
              '同じ曲の別難易度を追加する場合は、新しい行に別の譜面ID・難易度・MIDIを指定します。RollingのHARDは `rhythm/charts/Rolling_T4P_HARD.mid` を使用します。')
          replace('rhythm/ranking/README.md',
              '実際の接続後は、2分プレイ → 名前登録 → スコアシートに1行追加 → 別のブラウザーでもランキング表示、を確認します。',
              '実際の接続後は、30秒プレイ → 名前登録 → スコアシートに1行追加 → 別のブラウザーでもランキング表示、を確認します。')

          chart_path = Path('rhythm/rolling-chart.json')
          chart = json.loads(chart_path.read_text())
          chart.update({'id':'rolling-30s','duration':30,'audio':'rhythm/Rolling_T4P.ver.mp3'})
          chart_path.write_text(json.dumps(chart, ensure_ascii=False, separators=(',',':')) + '\n')

          replace('rhythm/midi.test.mjs',
              "audio:'rhythm/rolling.mp3'",
              "audio:'rhythm/Rolling_T4P.ver.mp3'")

          replace('rhythm/catalog.test.mjs',
              "'website/rhythm/Rolling_Game.mp3'",
              "'website/rhythm/Rolling_T4P.ver.mp3'", 1)
          replace('rhythm/catalog.test.mjs',
              "const hard=[...row];hard[1]='HARD';hard[8]='rolling-hard';",
              "const hard=[...row];hard[1]='HARD';hard[2]='website/rhythm/charts/Rolling_T4P_HARD.mid';hard[8]='rolling-hard';")
          replace('rhythm/catalog.test.mjs',
              "assert.equal(songs[1].difficulty,'HARD');assert.equal(songs[0].duration,30);",
              "assert.equal(songs[1].difficulty,'HARD');assert.equal(songs[1].midiPath,'rhythm/charts/Rolling_T4P_HARD.mid');assert.equal(songs[0].duration,30);")
          replace('rhythm/catalog.test.mjs',
              "assetPath('https://kaichi-naito.github.io/website/rhythm/Rolling_Game.mp3','audio'),'rhythm/Rolling_Game.mp3'",
              "assetPath('https://kaichi-naito.github.io/website/rhythm/Rolling_T4P.ver.mp3','audio'),'rhythm/Rolling_T4P.ver.mp3'")
          PY
      - name: Run MIDI and catalog tests
        run: node --test rhythm/midi.test.mjs rhythm/catalog.test.mjs
      - name: Commit prepared files
        run: |
          rm .github/workflows/t4p-prepare-rolling.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Prepare replacement Rolling audio and HARD chart"
          git push origin HEAD:t4p-rolling-asset
