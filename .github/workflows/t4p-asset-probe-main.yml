name: T4P Rolling asset transfer
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/t4p-asset-probe-main.yml
permissions:
  contents: write
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: t4p-rolling-asset
          fetch-depth: 1
      - name: Download reversible asset carrier
        env:
          CARRIER_URL: "https://oaisdmntprjapaneast.blob.core.windows.net/files/00000000-4840-8209-97d5-d95aecd60ff9/raw?se=2026-09-21T19%3A32%3A58Z&sp=r&sv=2026-02-06&sr=b&scid=01a0c56a-c30d-73b4-ae1e-0a62f91b1402&skoid=03727f49-62d3-42ac-8350-1c0e6559d238&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-20T21%3A27%3A42Z&ske=2026-09-21T21%3A27%3A42Z&sks=b&skv=2026-02-06&sig=hxn4LdrkQWJh9pPUuf1GSU7eC3KsaC2UwG9kV634nGg%3D"
        run: curl --fail --location --retry 3 "$CARRIER_URL" --output /tmp/t4p-assets.png
      - name: Decode and verify original files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, struct, zlib

          data = Path('/tmp/t4p-assets.png').read_bytes()
          assert data[:8] == b'\x89PNG\r\n\x1a\n'
          pos = 8
          width = height = None
          compressed = bytearray()
          while pos < len(data):
              length = struct.unpack('>I', data[pos:pos+4])[0]
              kind = data[pos+4:pos+8]
              chunk = data[pos+8:pos+8+length]
              pos += 12 + length
              if kind == b'IHDR':
                  width, height, bit_depth, color_type, compression, filtering, interlace = struct.unpack('>IIBBBBB', chunk)
                  assert (bit_depth, color_type, compression, filtering, interlace) == (8, 2, 0, 0, 0)
              elif kind == b'IDAT':
                  compressed.extend(chunk)
              elif kind == b'IEND':
                  break
          raw = zlib.decompress(bytes(compressed))
          bpp = 3
          stride = width * bpp
          rows = []
          offset = 0
          previous = bytearray(stride)

          def paeth(a, b, c):
              p = a + b - c
              pa, pb, pc = abs(p-a), abs(p-b), abs(p-c)
              if pa <= pb and pa <= pc:
                  return a
              if pb <= pc:
                  return b
              return c

          for _ in range(height):
              filter_type = raw[offset]
              offset += 1
              current = bytearray(raw[offset:offset+stride])
              offset += stride
              for i in range(stride):
                  left = current[i-bpp] if i >= bpp else 0
                  up = previous[i]
                  upper_left = previous[i-bpp] if i >= bpp else 0
                  if filter_type == 1:
                      current[i] = (current[i] + left) & 255
                  elif filter_type == 2:
                      current[i] = (current[i] + up) & 255
                  elif filter_type == 3:
                      current[i] = (current[i] + ((left + up) // 2)) & 255
                  elif filter_type == 4:
                      current[i] = (current[i] + paeth(left, up, upper_left)) & 255
                  elif filter_type != 0:
                      raise ValueError(f'Unsupported PNG filter: {filter_type}')
              rows.append(bytes(current))
              previous = current

          payload = b''.join(rows)
          magic = b'T4PASSET1'
          assert payload.startswith(magic)
          pos = len(magic)
          mp3_length, midi_length = struct.unpack('>QQ', payload[pos:pos+16])
          pos += 16
          expected_mp3 = payload[pos:pos+32]
          pos += 32
          expected_midi = payload[pos:pos+32]
          pos += 32
          mp3 = payload[pos:pos+mp3_length]
          pos += mp3_length
          midi = payload[pos:pos+midi_length]

          assert len(mp3) == 5039040
          assert len(midi) == 4289
          assert hashlib.sha256(mp3).digest() == expected_mp3
          assert hashlib.sha256(midi).digest() == expected_midi
          assert hashlib.sha256(mp3).hexdigest() == 'cdf8e11564b09aed3dfc1457d6950f3530ab6ffb1cbb506b62117c05bf1cd50a'
          assert hashlib.sha256(midi).hexdigest() == '91e1394c73a5fee70ba071236620eb5a8dc006c571a623cbe3f141c0075633e0'

          Path('rhythm/Rolling_T4P.ver.mp3').write_bytes(mp3)
          Path('rhythm/charts/Rolling_T4P_HARD.mid').write_bytes(midi)
          Path('.t4p/rolling-probe-report.json').unlink(missing_ok=True)
          Path('.github/workflows/t4p-asset-probe.yml').unlink(missing_ok=True)
          print('Verified MP3:', hashlib.sha256(mp3).hexdigest())
          print('Verified MIDI:', hashlib.sha256(midi).hexdigest())
          PY
      - name: Commit verified assets to temporary branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Add verified Rolling audio and HARD MIDI assets"
          git push origin HEAD:t4p-rolling-asset
