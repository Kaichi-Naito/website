<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="keywords" content="ギター, 作曲, 内藤海地, Kaichi, Kaichi Naito, PHALUX, Windows95">
    <meta name="description" content="Kaichi Guitar Musicのディスコグラフィー。オリジナル楽曲のリリース情報や各ストリーミング配信へのリンクをまとめています。">  
    <meta property="og:title" content="Discography - Kaichi Guitar Music">
    <meta property="og:description" content="Kaichiのオリジナル楽曲・ディスコグラフィーまとめ">
    <meta property="og:image" content="https://kaichi-naito.github.io/website/images/card-image.jpg">
    <meta property="og:url" content="https://kaichi-naito.github.io/website/Discography.html">
    <link rel="canonical" href="https://kaichi-naito.github.io/website/Discography.html">
    <meta property="og:type" content="website">
    <meta http-equiv="Cache-Control" content="max-age=31536000">
    <title>Discography - Kaichi Guitar Music</title>
    <link rel="icon" href="images/card-image.jpg" type="image/jpg">
        <link rel="stylesheet" href="css/common-ui.css">
    <style>
/* --- Discography page --- */
        .song-window {
            width: 550px;
            top: -9999px;
            left: -9999px;
        }

        .discography-section {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            margin: 0;
            padding: 0;
            border-bottom: none;
        }

        .album img {
            width: 180px;
            height: 180px;
            margin-right: 25px;
            border: 2px solid;
            border-color: #808080 #ffffff #ffffff #808080;
            object-fit: cover;
        }

        .album-info {
            text-align: left;
            color: black;
            flex-grow: 1;
            min-width: 0;
        }

        .album-info p {
            margin: 0 0 5px 0;
            font-size: 14px;
        }

        .artist-tag {
            color: #0000ff;
            font-weight: bold;
            font-size: 13px !important;
            margin-bottom: 2px !important;
        }

        .album-info h3 {
            margin: 0 0 10px 0;
            font-size: 1.5em;
        }

        .album-info a {
            color: blue;
            text-decoration: underline;
        }

        .links {
            margin-top: 15px;
        }

        .links a {
            margin-right: 10px;
            display: inline-block;
        }

        .links img {
            width: 45px !important;
            height: 45px !important;
            transition: transform 0.2s;
        }

        .links img:hover {
            transform: scale(1.1);
        }

        @media (max-width: 800px) {
            .song-window {
                width: 88vw !important;
                max-width: 400px !important;
            }

            .discography-section {
                flex-direction: row;
                margin: 5px 0;
                padding: 5px 0;
            }

            .album img {
                width: 120px;
                height: 120px;
                margin-right: 15px;
            }

            .album-info h3 {
                font-size: 1.2em;
                margin-bottom: 5px;
            }

            .album-info p {
                font-size: 12px;
            }

            .links img {
                width: 36px !important;
                height: 36px !important;
            }
        }

        .discography-status-window {
            width: 420px;
            top: 225px;
            left: calc(50% - 210px);
        }

        .discography-status-window .window-contents {
            line-height: 1.6;
        }

        @media (max-width: 800px) {
            .discography-status-window {
                width: 88vw !important;
                max-width: 400px !important;
                top: 175px;
                left: 6%;
            }
        }
    </style>
</head>
<body id="win95-desktop">
    <h1 class="header-title">Kaichi Guitar Music</h1>

    <div id="common-nav"></div>

    <div id="discography-root"></div>

    <div class="window discography-status-window" id="win-discography-loading">
        <div class="title-bar">
            <span>Discography.dat</span>
            <div class="title-bar-controls">
                <button type="button" class="window-control-button minimize-button" aria-label="Minimize">_</button>
                <button type="button" class="window-control-button maximize-button" aria-label="Maximize">□</button>
                <button type="button" class="close-button" aria-label="Close">×</button>
            </div>
        </div>
        <div class="window-contents">
            Loading discography...
        </div>
    </div>

    <script>
        /*
         * Discography data source
         * Google Sheets:
         * https://docs.google.com/spreadsheets/d/1wwfIJD348bAa0gB9KAMHXuLb6Nopi5Zd84f8FWSFpbA/
         *
         * Display rule:
         *   公開 = TRUE
         *   AND
         *   リリース日 <= today's date in Japan
         *
         * Rows are displayed newest-first automatically.
         */
        var DISCOGRAPHY_SHEET_ID = '1wwfIJD348bAa0gB9KAMHXuLb6Nopi5Zd84f8FWSFpbA';
        var DISCOGRAPHY_SHEET_NAME = 'シート1';
        var discographyLoadTimer = null;
        var discographyLoaded = false;

        function getCellValue(row, index) {
            if (!row || !row.c || !row.c[index]) return '';
            var cell = row.c[index];

            if (cell.v !== null && cell.v !== undefined) {
                return cell.v;
            }

            if (cell.f !== null && cell.f !== undefined) {
                return cell.f;
            }

            return '';
        }

        function asBoolean(value) {
            if (value === true) return true;
            if (value === false || value === null || value === undefined) return false;

            var normalized = String(value).trim().toLowerCase();
            return normalized === 'true' || normalized === '1' || normalized === 'yes';
        }

        function parseSheetDate(value, formattedValue) {
            var text = String(value || '').trim();

            /* Google Visualization API date format: Date(2026,6,19) */
            var gviz = text.match(/^Date\((\d{4}),\s*(\d{1,2}),\s*(\d{1,2})\)$/);
            if (gviz) {
                return {
                    year: Number(gviz[1]),
                    month: Number(gviz[2]) + 1,
                    day: Number(gviz[3])
                };
            }

            if (value instanceof Date && !isNaN(value.getTime())) {
                return {
                    year: value.getFullYear(),
                    month: value.getMonth() + 1,
                    day: value.getDate()
                };
            }

            var fallback = String(formattedValue || value || '').trim();
            var parts = fallback.match(/(\d{4})[\/.\-](\d{1,2})[\/.\-](\d{1,2})/);

            if (!parts) return null;

            return {
                year: Number(parts[1]),
                month: Number(parts[2]),
                day: Number(parts[3])
            };
        }

        function dateKey(dateParts) {
            if (!dateParts) return 0;
            return (dateParts.year * 10000) + (dateParts.month * 100) + dateParts.day;
        }

        function getTodayKeyInJapan() {
            var parts = new Intl.DateTimeFormat('en-US', {
                timeZone: 'Asia/Tokyo',
                year: 'numeric',
                month: '2-digit',
                day: '2-digit'
            }).formatToParts(new Date());

            var map = {};
            for (var i = 0; i < parts.length; i++) {
                if (parts[i].type !== 'literal') {
                    map[parts[i].type] = parts[i].value;
                }
            }

            return Number(map.year + map.month + map.day);
        }

        function formatReleaseDate(dateParts) {
            return dateParts.year + '.' + dateParts.month + '.' + dateParts.day;
        }

        function safeHttpUrl(value) {
            if (!value) return '';

            try {
                var url = new URL(String(value), window.location.href);
                if (url.protocol !== 'http:' && url.protocol !== 'https:') return '';
                return url.href;
            } catch (e) {
                return '';
            }
        }

        function safeJacketPath(value) {
            var text = String(value || '').trim();
            if (!text) return '';

            /* Normal sheet values are repository-relative jacket paths. */
            if (text.indexOf('images/CDjacket/') === 0) {
                return text;
            }

            try {
                var url = new URL(text, window.location.href);
                if (
                    url.protocol === 'https:' &&
                    url.hostname === 'kaichi-naito.github.io' &&
                    url.pathname.indexOf('/website/images/CDjacket/') === 0
                ) {
                    return url.href;
                }
            } catch (e) {}

            return '';
        }

        function linkLabelFromUrl(value) {
            var href = safeHttpUrl(value);
            if (!href) return '';

            try {
                var url = new URL(href);
                var path = url.pathname.replace(/^\/+|\/+$/g, '');

                if (
                    (url.hostname === 'twitter.com' ||
                     url.hostname === 'www.twitter.com' ||
                     url.hostname === 'x.com' ||
                     url.hostname === 'www.x.com') &&
                    path
                ) {
                    return '@' + path.split('/')[0];
                }
            } catch (e) {}

            return 'link';
        }

        function makeWindowControlButton(className, label, text) {
            var button = document.createElement('button');
            button.type = 'button';
            button.className = 'window-control-button ' + className;
            button.setAttribute('aria-label', label);
            button.textContent = text;
            return button;
        }

        function appendCredit(parent, text, url) {
            if (!text) return;

            var p = document.createElement('p');
            p.appendChild(document.createTextNode(String(text)));

            var href = safeHttpUrl(url);
            if (href) {
                p.appendChild(document.createTextNode(' '));

                var a = document.createElement('a');
                a.href = href;
                a.target = '_blank';
                a.rel = 'noopener noreferrer';
                a.className = 'click-target';
                a.textContent = linkLabelFromUrl(href);
                p.appendChild(a);
            }

            parent.appendChild(p);
        }

        function appendPlatformLink(parent, hrefValue, iconPath, label) {
            var href = safeHttpUrl(hrefValue);
            if (!href) return;

            var a = document.createElement('a');
            a.href = href;
            a.target = '_blank';
            a.rel = 'noopener noreferrer';
            a.className = 'click-target';

            var img = document.createElement('img');
            img.src = iconPath;
            img.alt = label;
            img.loading = 'lazy';

            a.appendChild(img);
            parent.appendChild(a);
        }

        function createReleaseWindow(item, index) {
            var win = document.createElement('div');
            win.className = 'window song-window';
            win.id = 'win-release-' + index;

            var titleBar = document.createElement('div');
            titleBar.className = 'title-bar draggable-cursor';
            titleBar.id = 'handle-release-' + index;

            var title = document.createElement('span');
            title.textContent = item.windowName || item.title || 'Release.exe';

            var controls = document.createElement('div');
            controls.className = 'title-bar-controls';
            controls.appendChild(makeWindowControlButton('minimize-button', 'Minimize', '_'));
            controls.appendChild(makeWindowControlButton('maximize-button', 'Maximize', '□'));

            var close = document.createElement('button');
            close.type = 'button';
            close.className = 'close-button';
            close.setAttribute('aria-label', 'Close');
            close.textContent = '×';
            controls.appendChild(close);

            titleBar.appendChild(title);
            titleBar.appendChild(controls);
            win.appendChild(titleBar);

            var contents = document.createElement('div');
            contents.className = 'window-contents';

            var section = document.createElement('div');
            section.className = 'discography-section';

            var album = document.createElement('div');
            album.className = 'album';

            var jacket = document.createElement('img');
            jacket.src = safeJacketPath(item.jacket);
            jacket.alt = item.title || 'Release artwork';

            /*
             * First 3 jackets are loaded immediately.
             * Everything below that remains lazy-loaded.
             */
            if (index < 3) {
                jacket.loading = 'eager';
                jacket.fetchPriority = 'high';
            } else {
                jacket.loading = 'lazy';
            }

            album.appendChild(jacket);

            var info = document.createElement('div');
            info.className = 'album-info';

            if (item.type) {
                var type = document.createElement('p');
                type.textContent = item.type;
                info.appendChild(type);
            }

            if (item.artistTag) {
                var artist = document.createElement('p');
                artist.className = 'artist-tag';
                artist.textContent = item.artistTag;
                info.appendChild(artist);
            }

            var h3 = document.createElement('h3');
            h3.textContent = item.title || '';
            info.appendChild(h3);

            if (item.note) {
                var note = document.createElement('p');
                note.textContent = item.note;
                info.appendChild(note);
            }

            var release = document.createElement('p');
            release.textContent = 'Release: ' + formatReleaseDate(item.releaseDate);
            info.appendChild(release);

            appendCredit(info, item.credit1, item.credit1Url);
            appendCredit(info, item.credit2, item.credit2Url);

            var links = document.createElement('div');
            links.className = 'links';

            appendPlatformLink(
                links,
                item.spotify,
                'https://kaichi-naito.github.io/website/images/spotify-icon.png',
                'Spotify'
            );

            appendPlatformLink(
                links,
                item.appleMusic,
                'https://kaichi-naito.github.io/website/images/applemusic_dot_logo.png',
                'Apple Music'
            );

            info.appendChild(links);
            section.appendChild(album);
            section.appendChild(info);
            contents.appendChild(section);
            win.appendChild(contents);

            return win;
        }

        function removeDiscographyStatusWindow() {
            var status = document.getElementById('win-discography-loading');
            if (status) status.remove();
        }

        function showDiscographyError(message) {
            if (discographyLoaded) return;

            clearTimeout(discographyLoadTimer);

            var status = document.getElementById('win-discography-loading');
            if (!status) return;

            var title = status.querySelector('.title-bar span');
            var contents = status.querySelector('.window-contents');

            if (title) title.textContent = 'Discography_Error.txt';
            if (contents) contents.textContent = message || 'Discography data could not be loaded.';

            if (window.KaichiUI && window.KaichiUI.refreshWindows) {
                window.KaichiUI.refreshWindows();
            }
        }

        function refreshDiscographyWindows() {
            if (window.KaichiUI && window.KaichiUI.refreshWindows) {
                window.KaichiUI.refreshWindows();
            }

            requestAnimationFrame(function () {
                setInitialPositions();
            });
        }

        /*
         * Google Visualization API JSONP callback.
         * Using a <script> request avoids cross-origin fetch issues on
         * static GitHub Pages.
         */
        window.handleDiscographyData = function (response) {
            clearTimeout(discographyLoadTimer);

            if (
                !response ||
                response.status === 'error' ||
                !response.table ||
                !response.table.rows
            ) {
                showDiscographyError('Discography data could not be loaded.');
                return;
            }

            var todayKey = getTodayKeyInJapan();
            var releases = [];

            for (var i = 0; i < response.table.rows.length; i++) {
                var row = response.table.rows[i];
                if (!row || !row.c) continue;

                var isPublic = asBoolean(getCellValue(row, 0));
                if (!isPublic) continue;

                var dateCell = row.c[1] || {};
                var releaseDate = parseSheetDate(dateCell.v, dateCell.f);
                if (!releaseDate) continue;

                var releaseKey = dateKey(releaseDate);

                /*
                 * Future releases remain hidden automatically.
                 * The comparison is based on Japan's calendar date.
                 */
                if (releaseKey > todayKey) continue;

                releases.push({
                    releaseDate: releaseDate,
                    releaseKey: releaseKey,
                    type: getCellValue(row, 3),
                    artistTag: getCellValue(row, 4),
                    title: getCellValue(row, 5),
                    windowName: getCellValue(row, 6),
                    jacket: getCellValue(row, 7),
                    note: getCellValue(row, 8),
                    credit1: getCellValue(row, 9),
                    credit1Url: getCellValue(row, 10),
                    credit2: getCellValue(row, 11),
                    credit2Url: getCellValue(row, 12),
                    spotify: getCellValue(row, 13),
                    appleMusic: getCellValue(row, 14)
                });
            }

            releases.sort(function (a, b) {
                return b.releaseKey - a.releaseKey;
            });

            var root = document.getElementById('discography-root');
            if (!root) return;

            root.innerHTML = '';

            for (var j = 0; j < releases.length; j++) {
                root.appendChild(createReleaseWindow(releases[j], j));
            }

            discographyLoaded = true;
            removeDiscographyStatusWindow();

            if (releases.length === 0) {
                showDiscographyError('No releases are currently available.');
                return;
            }

            refreshDiscographyWindows();
        };

        function loadDiscographyFromSheet() {
            if (discographyLoaded || document.getElementById('discography-sheet-loader')) {
                return;
            }

            var loader = document.createElement('script');
            loader.id = 'discography-sheet-loader';

            var tqx = 'out:json;responseHandler:handleDiscographyData';

            loader.src =
                'https://docs.google.com/spreadsheets/d/' +
                DISCOGRAPHY_SHEET_ID +
                '/gviz/tq?sheet=' +
                encodeURIComponent(DISCOGRAPHY_SHEET_NAME) +
                '&headers=1&tq=' +
                encodeURIComponent('select *') +
                '&tqx=' +
                encodeURIComponent(tqx) +
                '&_=' +
                Date.now();

            loader.onerror = function () {
                showDiscographyError('Discography data could not be loaded.');
            };

            document.body.appendChild(loader);

            discographyLoadTimer = setTimeout(function () {
                showDiscographyError('Discography data could not be loaded.');
            }, 10000);
        }

        function setInitialPositions() {
            var isMobile = window.matchMedia("(max-width: 800px)").matches;
            var songWindows = Array.prototype.slice.call(document.querySelectorAll('.song-window'));
            var currentTop = isMobile ? 175 : 225;
            var visibleIndex = 0;

            for (var i = 0; i < songWindows.length; i++) {
                var el = songWindows[i];
                if (!el || el.style.display === 'none' || el.dataset.closed === 'true') continue;

                if (isMobile) {
                    el.style.left = ((visibleIndex % 2 === 0) ? 2 : 8) + '%';
                } else {
                    var offset = (visibleIndex % 2 === 0) ? -24 : 24;
                    el.style.left = 'calc(50% - 275px + ' + offset + 'px)';
                }

                el.style.top = currentTop + 'px';
                currentTop += (el.offsetHeight || (isMobile ? 180 : 250)) + (isMobile ? 20 : 30);
                visibleIndex++;
            }

            document.body.style.minHeight = (currentTop + 120) + 'px';
        }

        window.onKaichiWindowClosed = function (win) {
            if (win && win.classList.contains('song-window')) {
                setTimeout(setInitialPositions, 0);
            }
        };

        /*
         * common-ui.js fires this after its Windows UI is ready.
         * Start the sheet request at that point so dynamically created
         * windows can immediately join the common window/taskbar system.
         */
        document.addEventListener('kaichi-ui-ready', function () {
            loadDiscographyFromSheet();
        }, { once: true });
    </script>
    <script src="js/common-ui.js"></script>
</body>
</html>
